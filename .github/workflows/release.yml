name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/../.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/../.cache/electron-builder
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            electron_os: mac
            artifacts: '*.dmg'
          - name: Windows
            os: windows-latest
            electron_os: win
            artifacts: '*.exe'
          - name: Linux
            os: ubuntu-latest
            electron_os: linux
            artifacts: '*.AppImage'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Check version matches tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match package.json version '${version}'."
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Package
        run: pnpm exec electron-builder --${{ matrix.electron_os }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List dist
        shell: bash
        run: ls -la dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.electron_os }}
          path: dist/${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows latest.yml
        if: matrix.electron_os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: feed-win-yml
          path: dist/latest.yml
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows blockmap
        if: matrix.electron_os == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: feed-win-blockmap
          path: dist/*.exe.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Checksums
        run: |
          cd installers
          sha256sum * | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/*.exe
            installers/*.dmg
            installers/*.AppImage
            installers/SHA256SUMS.txt
            installers/latest.yml
            installers/*.exe.blockmap
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
