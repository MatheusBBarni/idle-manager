appId: app.opsource.desktop
productName: Opsource
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
mac:
  target:
    - dmg
  category: public.app-category.utilities
linux:
  target:
    - AppImage
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
