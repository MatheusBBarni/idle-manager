appId: app.idlemanager.desktop
productName: Idle manager
artifactName: ${name}-${version}-${os}-${arch}.${ext}
npmRebuild: false
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  icon: resources/icon.icns
  identity: null
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  icon: assets/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  releaseType: release
